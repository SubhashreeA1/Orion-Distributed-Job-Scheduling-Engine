syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.orion.grpc";
option java_outer_classname = "JobProto";

service WorkerService {
  rpc ExecuteJob (JobRequest) returns (JobResponse);
}

message JobRequest {
  string jobId = 1;
  string payload = 2;
}

message JobResponse {
  string status = 1;
}
